apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: {{ .Release.Namespace }}
spec:
  instances: 2
  enablePDB: true
  probes:
    readiness:
      type: query
    startup:
      type: query
  imageName: "{{ .Values.images.database.repository }}:{{ .Values.images.database.tag }}"
  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
      effective_cache_size: 512MB
      maintenance_work_mem: 64MB
      checkpoint_completion_target: "0.9"
      wal_buffers: 16MB
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
  managed:
    roles:
      - name: immich-database_user
        login: true
        superuser: true
  bootstrap:
    initdb:
      database: immich-database
      owner: immich-database_user
      postInitSQL:
        - CREATE EXTENSION vchord CASCADE
        - CREATE EXTENSION IF NOT EXISTS "cube" CASCADE
        - CREATE EXTENSION IF NOT EXISTS "earthdistance" CASCADE
    recovery:
      source: immich-database-b2-backup
      database: immich-database
      owner: immich-database_user
      secret:
        name: immich-database-app

  externalClusters:
    - name: immich-database-b2-backup
      barmanObjectStore:
        destinationPath: {{ .Values.cnpg.backup.destinationPath }}
        serverName: immich-database
        endpointURL: {{ .Values.cnpg.backup.endpointURL }}
        s3Credentials:
          accessKeyId:
            name: {{ .Values.cnpg.backup.secretName }}
            key: AWS_ACCESS_KEY_ID
          secretAccessKey:
            name: {{ .Values.cnpg.backup.secretName }}
            key: AWS_SECRET_ACCESS_KEY

  backup:
    barmanObjectStore:
      destinationPath: {{ .Values.cnpg.backup.destinationPath }}
      serverName: immich-database
      endpointURL: {{ .Values.cnpg.backup.endpointURL }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.cnpg.backup.secretName }}
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: {{ .Values.cnpg.backup.secretName }}
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
    retentionPolicy: {{ .Values.cnpg.backup.retentionPolicy | quote }}

  storage:
    size: {{ .Values.databaseVolumeSizeGi }}Gi
    storageClass: longhorn
