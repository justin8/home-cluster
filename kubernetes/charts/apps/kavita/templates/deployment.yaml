apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kavita
  template:
    metadata:
      labels:
        app: kavita
    spec:
      securityContext:
        runAsUser: {{ .Values.PUID }}
        runAsGroup: {{ .Values.PGID }}
        fsGroup: {{ .Values.PGID }}
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-permissions
          image: "{{ .Values.images.busybox.repository }}:{{ .Values.images.busybox.tag }}"
          imagePullPolicy: {{ .Values.images.busybox.pullPolicy }}
          command:
            - sh
            - -c
            - chown -R {{ .Values.PUID }}:{{ .Values.PGID }} /kavita/config
          volumeMounts:
            - name: config
              mountPath: /kavita/config
          securityContext:
            runAsUser: 0
        - name: update-oidc-config
          image: "{{ .Values.images.python.repository }}:{{ .Values.images.python.tag }}"
          imagePullPolicy: {{ .Values.images.python.pullPolicy }}
          env:
            - name: OIDC_AUTHORITY
              valueFrom:
                secretKeyRef:
                  name: kavita-oidc-credentials
                  key: issuer_url
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: kavita-oidc-credentials
                  key: client_id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kavita-oidc-credentials
                  key: client_secret
          command:
            - python3
            - -c
            - |
              import json, os, tempfile
              config_file = "/kavita/config/appsettings.json"
              if os.path.exists(config_file):
                  print(f"Found {config_file}, checking OIDC settings...")
                  with open(config_file, "r") as f:
                      data = json.load(f)
                  oidc = data.get("OpenIdConnectSettings")
                  if isinstance(oidc, dict):
                      if "Authority" in oidc and os.environ.get("OIDC_AUTHORITY"):
                          oidc["Authority"] = os.environ["OIDC_AUTHORITY"]
                      if "ClientId" in oidc and os.environ.get("OIDC_CLIENT_ID"):
                          oidc["ClientId"] = os.environ["OIDC_CLIENT_ID"]
                      if "Secret" in oidc and os.environ.get("OIDC_CLIENT_SECRET"):
                          oidc["Secret"] = os.environ["OIDC_CLIENT_SECRET"]
                      with tempfile.NamedTemporaryFile("w", dir="/kavita/config", delete=False) as tmp:
                          json.dump(data, tmp, indent=2)
                          tmp_name = tmp.name
                      os.replace(tmp_name, config_file)
                      print(f"Successfully processed OIDC settings in {config_file}")
              else:
                  print(f"{config_file} not found, skipping.")
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /kavita/config
            - name: tmp
              mountPath: /tmp
      containers:
        - name: kavita
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          ports:
            - containerPort: 5000
          env:
            - name: TZ
              value: {{ .Values.TZ }}
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /kavita/config
            - name: media
              mountPath: /mnt/pool/media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: kavita-config-v3
        - name: media
          nfs:
            server: {{ .Values.network.storageServer }}
            path: /mnt/pool/media
        - name: tmp
          emptyDir: {}

