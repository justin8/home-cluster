    - name: Internet Access (Cloudflare DNS)
      group: Network & Internet
      url: icmp://1.1.1.1
      interval: 30s
      conditions:
        - "[CONNECTED] == true"
      alerts:
        - type: custom
          description: "External internet connectivity via Cloudflare DNS (1.1.1.1) ICMP ping"
    - name: Internet Access (Google DNS)
