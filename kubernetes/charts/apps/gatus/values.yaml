images:
  app:
    repository: twinproduction/gatus
    tag: v5.37.0
    pullPolicy: IfNotPresent

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 64Mi

persistence:
  enabled: true
  size: 2Gi

config:
  metrics: true
  storage:
    type: sqlite
    path: /data/data.db
  alerting:
    custom:
      url: "${ALERT_WEBHOOK_URL}"
      method: "POST"
      headers:
        Content-Type: "application/json"
      body: |
        {
          "status": "[ALERT_TRIGGERED_OR_RESOLVED]",
          "service": "[ENDPOINT_NAME]",
          "group": "[ENDPOINT_GROUP]",
          "url": "[ENDPOINT_URL]",
          "description": "[ALERT_DESCRIPTION]",
          "errors": "[RESULT_ERRORS]",
          "conditions": "[RESULT_CONDITIONS]"
        }
      default-alert:
        enabled: true
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: false
        description: "Health check failed"
  ui:
    title: "Cluster Status"
    header: "Home Cluster Status"
    description: "Automated service health and uptime"
    default-sort-by: group
  connectivity:
    checker:
      target: "1.1.1.1:53"
      interval: 30s
  endpoints:
    # ---------------------------------------------------------
    # Core Services (Public Ingress & Web UI)
    # ---------------------------------------------------------
    - name: Argo CD
      group: Core Services
      url: https://argocd.dray.id.au
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
      alerts:
        - type: custom
          description: "Argo CD public web UI and TLS certificate validity"
    - name: Pomerium Proxy
      group: Core Services
      url: https://authenticate.dray.id.au/ping
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
      alerts:
        - type: custom
          description: "Pomerium identity-aware proxy authentication endpoint and TLS certificate validity"
    - name: PocketID
      group: Core Services
      url: https://pocketid.dray.id.au/health
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
      alerts:
        - type: custom
          description: "PocketID authentication service healthcheck and TLS certificate validity"

    # ---------------------------------------------------------
    # Media Apps (Public Ingress & Web UI)
    # ---------------------------------------------------------
    - name: Immich
      group: Media Apps
      url: https://immich.dray.id.au/api/server/ping
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
      alerts:
        - type: custom
          description: "Immich photo management server ping endpoint and TLS certificate validity"
    - name: Audiobookshelf
      group: Media Apps
      url: https://audiobookshelf.dray.id.au/healthcheck
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
      alerts:
        - type: custom
          description: "Audiobookshelf audiobook server healthcheck and TLS certificate validity"
    - name: Jellyfin
      group: Media Apps
      url: https://jellyfin.dray.id.au/health
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
      alerts:
        - type: custom
          description: "Jellyfin media streaming server healthcheck and TLS certificate validity"
    - name: Kavita
      group: Media Apps
      url: https://kavita.dray.id.au/api/health
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
      alerts:
        - type: custom
          description: "Kavita digital reader server healthcheck and TLS certificate validity"
    - name: Plex
      group: Media Apps
      url: https://plex.dray.id.au/identity
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
      alerts:
