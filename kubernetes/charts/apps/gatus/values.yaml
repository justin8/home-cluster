images:
  app:
    repository: twinproduction/gatus
    tag: v5.37.0
    pullPolicy: IfNotPresent

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 64Mi

persistence:
  enabled: true
  size: 2Gi

config:
  metrics: true
  storage:
    type: sqlite
    path: /data/data.db
  ui:
    title: "Cluster Status"
    header: "Home Cluster Status"
    description: "Automated service health and uptime"
  connectivity:
    checker:
      target: "1.1.1.1:53"
      interval: 30s
  endpoints:
    - name: Argo CD
      group: Core Services
      url: https://argocd.dray.id.au
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
    - name: Pomerium Proxy
      group: Core Services
      url: https://authenticate.dray.id.au/.pomerium/healthz
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
    - name: PocketID
      group: Core Services
      url: https://pocketid.dray.id.au/health
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
    - name: Immich
      group: Media Apps
      url: https://immich.dray.id.au/api/server/ping
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
    - name: Audiobookshelf
      group: Media Apps
      url: https://audiobookshelf.dray.id.au/healthcheck
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
    - name: Jellyfin
      group: Media Apps
      url: https://jellyfin.dray.id.au/health
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
    - name: Kavita
      group: Media Apps
      url: https://kavita.dray.id.au/api/health
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
    - name: Plex
      group: Media Apps
      url: https://plex.dray.id.au/identity
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
    - name: Home Assistant
      group: Services
      url: https://homeassistant.dray.id.au
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
    - name: Syncthing
      group: Services
      url: https://syncthing.dray.id.au
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
    - name: UHF Server
      group: Services
      url: https://uhf.dray.id.au
      interval: 1m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 48h"
    - name: Storage Server (NFS)
      group: Infrastructure
      url: icmp://100.92.202.28
      interval: 30s
      conditions:
        - "[CONNECTED] == true"
    - name: Local Gateway
      group: Infrastructure
      url: icmp://192.168.5.1
      interval: 30s
      conditions:
        - "[CONNECTED] == true"
    - name: Control Plane 1
      group: Infrastructure
      url: icmp://192.168.5.11
      interval: 30s
      conditions:
        - "[CONNECTED] == true"
    - name: Control Plane 2
      group: Infrastructure
      url: icmp://192.168.5.12
      interval: 30s
      conditions:
        - "[CONNECTED] == true"
    - name: Control Plane 3
      group: Infrastructure
      url: icmp://192.168.5.13
      interval: 30s
      conditions:
        - "[CONNECTED] == true"
