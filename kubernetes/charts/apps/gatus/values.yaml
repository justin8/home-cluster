          description: "Plex media server identity endpoint and TLS certificate validity"

    # ---------------------------------------------------------
    # Services & Automation (Public Ingress & Web UI)
    # ---------------------------------------------------------
    - name: Home Assistant
      group: Services
      url: https://home-assistant.dray.id.au
      interval: 1m
      conditions:
