    # ---------------------------------------------------------
    # Physical Infrastructure & Networking
    # ---------------------------------------------------------
    - name: Storage Server (NFS)
      group: Infrastructure
      url: icmp://100.92.202.28
      interval: 30s
      conditions:
        - "[CONNECTED] == true"
      alerts:
        - type: custom
          description: "TrueNAS NFS storage server network reachability via ICMP ping"
    - name: Local Gateway
      group: Infrastructure
      url: icmp://192.168.5.1
      interval: 30s
      conditions:
        - "[CONNECTED] == true"
      alerts:
        - type: custom
          description: "Local LAN default gateway (192.168.5.1) network reachability via ICMP ping"
    - name: Kubernetes Node 1
      group: Infrastructure
      url: icmp://192.168.5.11
      interval: 30s
      conditions:
        - "[CONNECTED] == true"
      alerts:
        - type: custom
          description: "Talos Kubernetes Node 1 (192.168.5.11) network reachability via ICMP ping"
    - name: Kubernetes Node 2
      group: Infrastructure
      url: icmp://192.168.5.12
      interval: 30s
      conditions:
        - "[CONNECTED] == true"
      alerts:
