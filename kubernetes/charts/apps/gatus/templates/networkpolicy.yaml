apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gatus
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app: gatus
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: pomerium
            app.kubernetes.io/name: pomerium
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Probes to all in-cluster services and pods
    - toEntities:
        - cluster
    # Probes through Pomerium ingress VIPs
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: pomerium
            app.kubernetes.io/name: pomerium
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    - toCIDRSet:
        - cidr: 192.168.5.4/32
        - cidr: 100.99.223.17/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    # Probes to local LAN and Tailscale devices (e.g. NAS, Talos nodes, router)
    - toCIDRSet:
        - cidr: 192.168.5.0/24
        - cidr: 100.64.0.0/10
    # Probes to external world (WAN, public DNS, public URLs)
    - toEntities:
        - world
