apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
      annotations:
        checksum/config: {{ .Values.config | toYaml | sha256sum }}
    spec:
      securityContext:
        fsGroup: {{ .Values.groupId }}
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: gatus
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
            - name: PORT
              value: "8080"
            - name: ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: gatus-secrets
                  key: ALERT_WEBHOOK_URL
          securityContext:
            capabilities:
              add:
                - NET_RAW
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              port: 8080
              path: /health
            initialDelaySeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              port: 8080
              path: /health
            initialDelaySeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: gatus-config
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data
        {{- end }}
