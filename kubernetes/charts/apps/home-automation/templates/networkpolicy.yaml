apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-assistant
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app: home-assistant
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: pomerium
            app.kubernetes.io/name: pomerium
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    - fromCIDRSet:
        - cidr: {{ .Values.network.lanIpRange }}
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
            - port: "21063"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            app: mqtt
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            cnpg.io/cluster: homeassistant-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toCIDRSet:
        - cidr: {{ .Values.network.lanIpRange }}
    - toEntities:
        - world
---
