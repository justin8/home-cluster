apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan
  namespace: {{ .Release.Namespace }}
spec:
  config: '{
    "cniVersion": "0.3.1",
    "type": "macvlan",
    "master": "eth0",
    "mode": "bridge",
    "ipam": {
      "type": "host-local",
      "subnet": "{{ .Values.network.lanIpRange }}",
      "rangeStart": "192.168.5.8",
      "rangeEnd": "192.168.5.8"
    }
  }'
