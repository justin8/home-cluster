{{- range (list "esphome" "home-assistant" "mqtt" "zigbee2mqtt") }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ . }}
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
    minReplicas: 1
{{- end }}
