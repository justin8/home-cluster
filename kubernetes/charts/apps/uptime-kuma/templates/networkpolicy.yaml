apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: uptime-kuma
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app: uptime-kuma
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: pomerium
            app.kubernetes.io/name: pomerium
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
  egress:
    # Allow probes to all in-cluster services and pods
    - toEntities:
        - cluster
    # Allow checking through Pomerium ingress VIPs
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: pomerium
            app.kubernetes.io/name: pomerium
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    - toCIDRSet:
        - cidr: {{ .Values.network.pomeriumIngress }}/32
        - cidr: {{ .Values.network.privateIngress }}/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    # Allow probes to local LAN and Tailscale devices (e.g. NAS, Talos nodes, router)
    - toCIDRSet:
        - cidr: {{ .Values.network.lanIpRange }}
        - cidr: {{ .Values.network.tailscaleIpRange }}
    # Allow probes to external world (WAN, public DNS, notification webhooks)
    - toEntities:
        - world
