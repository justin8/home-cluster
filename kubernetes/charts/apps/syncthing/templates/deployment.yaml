apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      securityContext:
        runAsUser: {{ .Values.userId }}
        runAsGroup: {{ .Values.groupId }}
        fsGroup: {{ .Values.groupId }}
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: syncthing
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8384
              hostPort: 8384
              name: web
            - containerPort: 22000
              hostPort: 22000
              name: sync-tcp
            - containerPort: 22000
              hostPort: 22000
              protocol: UDP
              name: sync-udp
            - containerPort: 21027
              hostPort: 21027
              protocol: UDP
              name: discovery
          env:
            - name: TZ
              value: {{ .Values.TZ }}
            - name: HOME
              value: /tmp
            - name: STHOMEDIR
              value: /config
            - name: STGUIADDRESS
              value: 0.0.0.0:8384
          livenessProbe:
            httpGet:
              port: 8384
              path: /
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              port: 8384
              path: /
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: syncthing-config-v2
        - name: data
          nfs:
            server: {{ .Values.network.storageServer }}
            path: {{ .Values.appStoragePath }}/syncthing
        - name: tmp
          emptyDir: {}
