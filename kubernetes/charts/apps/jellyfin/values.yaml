volumeSizeGi: 50
cacheVolumeSizeGi: 50

images:
  app:
    repository: ghcr.io/justin8/jellyfin-rffmpeg
    tag: "12.1"
    pullPolicy: Always
  worker:
    repository: ghcr.io/justin8/jellyfin-rffmpeg-worker
    tag: "12.1"
    pullPolicy: Always

theme:
  abyss:
    enabled: true
    repo: "AumGupta/abyss-jellyfin"
    branch: "main"
    autoDefaults: true

grpcWorker:
  enabled: true
  maxWorkers: 3
  image:
    repository: ghcr.io/crystalnet-org/ffmpeg-worker
    tag: "8.1.3-7.10"
    pullPolicy: IfNotPresent
