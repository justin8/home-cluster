apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      serviceAccountName: jellyfin
      securityContext:
        fsGroup: {{ .Values.PGID }}
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: provision-sso-config
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          env:
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: issuer_url
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: client_id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: client_secret
          command:
            - /bin/sh
            - -cu
            - |
              CONFIG_DIR="/config/plugins/configurations"
              CONFIG_FILE="$CONFIG_DIR/SSO-Auth.xml"
              mkdir -p "$CONFIG_DIR"
              if [ ! -f "$CONFIG_FILE" ] || ! grep -q "DisablePushedAuthorization" "$CONFIG_FILE"; then
                echo "Injecting Pocket ID configuration with AdminRoles, SchemeOverride, and DisablePushedAuthorization into $CONFIG_FILE..."
                printf '%s\n' \
                  '<?xml version="1.0" encoding="utf-8"?>' \
                  '<PluginConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">' \
                  '  <SamlConfigs />' \
                  '  <OidConfigs>' \
                  '    <item>' \
                  '      <key>' \
                  '        <string>pocketid</string>' \
                  '      </key>' \
                  '      <value>' \
                  '        <PluginConfiguration>' \
                  "          <OidEndpoint>${OIDC_ISSUER}/.well-known/openid-configuration</OidEndpoint>" \
                  "          <OidClientId>${OIDC_CLIENT_ID}</OidClientId>" \
                  "          <OidSecret>${OIDC_CLIENT_SECRET}</OidSecret>" \
                  '          <Enabled>true</Enabled>' \
                  '          <EnableAuthorization>true</EnableAuthorization>' \
                  '          <EnableAllFolders>true</EnableAllFolders>' \
                  '          <SchemeOverride>https</SchemeOverride>' \
                  '          <DisablePushedAuthorization>true</DisablePushedAuthorization>' \
                  '          <RoleClaim>groups</RoleClaim>' \
                  '          <AdminRoles>' \
                  '            <string>admin</string>' \
                  '            <string>Admin</string>' \
                  '          </AdminRoles>' \
                  '          <PreserveAdminPermissions>true</PreserveAdminPermissions>' \
                  '          <OidScopes>' \
                  '            <string>openid</string>' \
                  '            <string>profile</string>' \
                  '            <string>email</string>' \
                  '            <string>groups</string>' \
                  '          </OidScopes>' \
                  '        </PluginConfiguration>' \
                  '      </value>' \
                  '    </item>' \
                  '  </OidConfigs>' \
                  '</PluginConfiguration>' > "$CONFIG_FILE"
                echo "Successfully wrote $CONFIG_FILE"
              else
                echo "$CONFIG_FILE already contains updated configuration, preserving existing configuration."
              fi
        - name: init-rffmpeg
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          command:
            - rffmpeg-init
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: rffmpeg-config
              mountPath: /etc/rffmpeg/rffmpeg.yml
              subPath: rffmpeg.yml
            - name: ssh-key
              mountPath: /etc/rffmpeg-ssh
              readOnly: true
      containers:
        - name: jellyfin
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: TZ
              value: {{ .Values.TZ }}
            - name: JELLYFIN_DATA_DIR
              value: /config
            - name: JELLYFIN_CACHE_DIR
              value: /cache
            - name: TMPDIR
              value: /cache/temp
            - name: JELLYFIN_FFMPEG
              value: /usr/local/bin/ffmpeg
          resources:
            requests:
              gpu.intel.com/i915: "1"
            limits:
              gpu.intel.com/i915: "1"
          livenessProbe:
            httpGet:
              port: 8096
              path: /health
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              port: 8096
              path: /health
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /mnt/pool/media
            - name: rffmpeg-config
              mountPath: /etc/rffmpeg/rffmpeg.yml
              subPath: rffmpeg.yml
            - name: shm
              mountPath: /run/shm
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: media
          nfs:
            server: {{ .Values.network.storageServer }}
            path: /mnt/pool/media
        - name: rffmpeg-config
          configMap:
            name: jellyfin-rffmpeg-config
        - name: ssh-key
          secret:
            secretName: jellyfin-rffmpeg-ssh
            defaultMode: 0400
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi

