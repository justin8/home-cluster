apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      serviceAccountName: jellyfin
      securityContext:
        fsGroup: {{ .Values.PGID }}
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-config
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          env:
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: issuer_url
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: client_id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: client_secret
            - name: GRPC_ENABLED
              value: {{ and .Values.grpcWorker .Values.grpcWorker.enabled | default false | quote }}
            {{- if and .Values.grpcWorker .Values.grpcWorker.enabled }}
            - name: VALID_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jellyfin-grpc-worker
                  key: VALID_TOKEN
            {{- end }}
          command:
            - python3
            - /scripts/init.py
          volumeMounts:
            - name: config
              mountPath: /config
            - name: init-script
              mountPath: /scripts
            - name: jellyfin-web
              mountPath: /web-override
        - name: init-rffmpeg
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          command:
            - rffmpeg-init
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: rffmpeg-config
              mountPath: /etc/rffmpeg/rffmpeg.yml
              subPath: rffmpeg.yml
            - name: ssh-key
              mountPath: /etc/rffmpeg-ssh
              readOnly: true

      containers:
        - name: jellyfin
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: TZ
              value: {{ .Values.TZ }}
            - name: JELLYFIN_DATA_DIR
              value: /config
            - name: JELLYFIN_CACHE_DIR
              value: /cache
            - name: TMPDIR
              value: /cache/temp
            - name: JELLYFIN_FFMPEG
              value: /usr/local/bin/ffmpeg
          livenessProbe:
            httpGet:
              port: 8096
              path: /health
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              port: 8096
              path: /health
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: jellyfin-web
              mountPath: /jellyfin/jellyfin-web
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /mnt/pool/media
            - name: rffmpeg-config
              mountPath: /etc/rffmpeg/rffmpeg.yml
              subPath: rffmpeg.yml
            - name: shm
              mountPath: /run/shm
        - name: rffmpeg-sync
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          command:
            - rffmpeg-init
            - --interval
            - "60"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: rffmpeg-config
              mountPath: /etc/rffmpeg/rffmpeg.yml
              subPath: rffmpeg.yml
            - name: ssh-key
              mountPath: /etc/rffmpeg-ssh
              readOnly: true
      volumes:
        - name: init-script
          configMap:
            name: jellyfin-init-script
            defaultMode: 0755
        - name: jellyfin-web
          emptyDir: {}
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-v2
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache-v2
        - name: media
          nfs:
            server: {{ .Values.network.storageServer }}
            path: /mnt/pool/media
        - name: rffmpeg-config
          configMap:
            name: jellyfin-rffmpeg-config
        - name: ssh-key
          secret:
            secretName: jellyfin-rffmpeg-ssh
            defaultMode: 0400
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi

