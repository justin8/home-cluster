apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      serviceAccountName: jellyfin
      securityContext:
        fsGroup: {{ .Values.PGID }}
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: provision-sso-config
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          env:
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: issuer_url
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: client_id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: client_secret
          command:
            - /bin/sh
            - -cu
            - |
              # 1. Ensure Jellyfin SSO repository is in system.xml
              CONFIG_DIR="/config/config"
              SYSTEM_FILE="$CONFIG_DIR/system.xml"
              if [ -f "$SYSTEM_FILE" ] && ! grep -q "k0lin/jellyfin-plugin-sso" "$SYSTEM_FILE"; then
                if grep -q "</PluginRepositories>" "$SYSTEM_FILE"; then
                  echo "Adding Jellyfin SSO repository to $SYSTEM_FILE..."
                  sed -i 's|</PluginRepositories>|  <RepositoryInfo>\n      <Name>Jellyfin SSO</Name>\n      <Url>https://raw.githubusercontent.com/k0lin/jellyfin-plugin-sso/manifest-release/manifest.json</Url>\n      <Enabled>true</Enabled>\n    </RepositoryInfo>\n  </PluginRepositories>|' "$SYSTEM_FILE"
                elif grep -q "<PluginRepositories />" "$SYSTEM_FILE"; then
                  echo "Expanding self-closing PluginRepositories and adding Jellyfin SSO repository to $SYSTEM_FILE..."
                  sed -i 's|<PluginRepositories />|<PluginRepositories>\n    <RepositoryInfo>\n      <Name>Jellyfin SSO</Name>\n      <Url>https://raw.githubusercontent.com/k0lin/jellyfin-plugin-sso/manifest-release/manifest.json</Url>\n      <Enabled>true</Enabled>\n    </RepositoryInfo>\n  </PluginRepositories>|' "$SYSTEM_FILE"
                fi
              fi

              # 2. Install SSO Authentication plugin if missing (Option 2)
              PLUGIN_DIR="/config/plugins"
              mkdir -p "$PLUGIN_DIR"
              if ! ls -d "$PLUGIN_DIR"/SSO* >/dev/null 2>&1; then
                echo "SSO Authentication plugin missing from $PLUGIN_DIR. Installing v5.1.1..."
                TMP_ZIP="/tmp/sso-plugin.zip"
                TARGET_DIR="$PLUGIN_DIR/SSO Authentication_5.1.1"
                mkdir -p "$TARGET_DIR"
                if curl -fsSL "https://github.com/k0lin/jellyfin-plugin-sso/releases/download/v5.1.1/sso-authentication_5.1.1.zip" -o "$TMP_ZIP"; then
                  if command -v python3 >/dev/null 2>&1; then
                    python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$TMP_ZIP" "$TARGET_DIR"
                  elif command -v unzip >/dev/null 2>&1; then
                    unzip -qo "$TMP_ZIP" -d "$TARGET_DIR"
                  else
                    echo "ERROR: Neither python3 nor unzip available to extract $TMP_ZIP"
                  fi
                  rm -f "$TMP_ZIP"
                  echo "Installed SSO Authentication plugin to $TARGET_DIR"
                else
                  echo "WARNING: Failed to download SSO Authentication plugin"
                  rm -rf "$TARGET_DIR"
                fi
              else
                echo "SSO Authentication plugin already present in $PLUGIN_DIR"
              fi

              # 3. Provision SSO configuration if missing (Option 2)
              PLUGIN_CONFIG_DIR="/config/plugins/configurations"
              CONFIG_FILE="$PLUGIN_CONFIG_DIR/SSO-Auth.xml"
              mkdir -p "$PLUGIN_CONFIG_DIR"
              if [ ! -f "$CONFIG_FILE" ]; then
                echo "SSO configuration missing. Injecting Pocket ID configuration with AdminRoles, SchemeOverride, and DisablePushedAuthorization into $CONFIG_FILE..."
                printf '%s\n' \
                  '<?xml version="1.0" encoding="utf-8"?>' \
                  '<PluginConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">' \
                  '  <SamlConfigs />' \
                  '  <OidConfigs>' \
                  '    <item>' \
                  '      <key>' \
                  '        <string>pocketid</string>' \
                  '      </key>' \
                  '      <value>' \
                  '        <PluginConfiguration>' \
                  "          <OidEndpoint>${OIDC_ISSUER}/.well-known/openid-configuration</OidEndpoint>" \
                  "          <OidClientId>${OIDC_CLIENT_ID}</OidClientId>" \
                  "          <OidSecret>${OIDC_CLIENT_SECRET}</OidSecret>" \
                  '          <Enabled>true</Enabled>' \
                  '          <EnableAuthorization>true</EnableAuthorization>' \
                  '          <EnableAllFolders>true</EnableAllFolders>' \
                  '          <SchemeOverride>https</SchemeOverride>' \
                  '          <DisablePushedAuthorization>true</DisablePushedAuthorization>' \
                  '          <RoleClaim>groups</RoleClaim>' \
                  '          <AdminRoles>' \
                  '            <string>admin</string>' \
                  '            <string>Admin</string>' \
                  '          </AdminRoles>' \
                  '          <PreserveAdminPermissions>true</PreserveAdminPermissions>' \
                  '          <OidScopes>' \
                  '            <string>openid</string>' \
                  '            <string>profile</string>' \
                  '            <string>email</string>' \
                  '            <string>groups</string>' \
                  '          </OidScopes>' \
                  '        </PluginConfiguration>' \
                  '      </value>' \
                  '    </item>' \
                  '  </OidConfigs>' \
                  '</PluginConfiguration>' > "$CONFIG_FILE"
                echo "Successfully wrote $CONFIG_FILE"
              else
                echo "$CONFIG_FILE already exists, preserving existing configuration."
              fi
          volumeMounts:
            - name: config
              mountPath: /config
        - name: init-rffmpeg
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          command:
            - rffmpeg-init
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: rffmpeg-config
              mountPath: /etc/rffmpeg/rffmpeg.yml
              subPath: rffmpeg.yml
            - name: ssh-key
              mountPath: /etc/rffmpeg-ssh
              readOnly: true
        {{- if and .Values.grpcWorker .Values.grpcWorker.enabled }}
        - name: init-grpc-config
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          env:
            - name: VALID_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jellyfin-grpc-worker
                  key: VALID_TOKEN
          command:
            - /bin/sh
            - -cu
            - |
              # 1. Ensure gRPC-ffmpeg repository is in system.xml
              CONFIG_DIR="/config/config"
              SYSTEM_FILE="$CONFIG_DIR/system.xml"
              if [ -f "$SYSTEM_FILE" ] && ! grep -q "CrystalNET-org/Jellyfin.Plugin.GrpcFfmpeg" "$SYSTEM_FILE"; then
                if grep -q "</PluginRepositories>" "$SYSTEM_FILE"; then
                  echo "Adding gRPC-ffmpeg repository to $SYSTEM_FILE..."
                  sed -i 's|</PluginRepositories>|  <RepositoryInfo>\n      <Name>gRPC-ffmpeg</Name>\n      <Url>https://raw.githubusercontent.com/CrystalNET-org/Jellyfin.Plugin.GrpcFfmpeg/main/manifest.json</Url>\n      <Enabled>true</Enabled>\n    </RepositoryInfo>\n  </PluginRepositories>|' "$SYSTEM_FILE"
                elif grep -q "<PluginRepositories />" "$SYSTEM_FILE"; then
                  echo "Expanding self-closing PluginRepositories and adding gRPC-ffmpeg repository to $SYSTEM_FILE..."
                  sed -i 's|<PluginRepositories />|<PluginRepositories>\n    <RepositoryInfo>\n      <Name>gRPC-ffmpeg</Name>\n      <Url>https://raw.githubusercontent.com/CrystalNET-org/Jellyfin.Plugin.GrpcFfmpeg/main/manifest.json</Url>\n      <Enabled>true</Enabled>\n    </RepositoryInfo>\n  </PluginRepositories>|' "$SYSTEM_FILE"
                fi
              fi

              # 2. Install gRPC-ffmpeg plugin if missing (Option 2)
              PLUGIN_DIR="/config/plugins"
              mkdir -p "$PLUGIN_DIR"
              if ! ls -d "$PLUGIN_DIR"/gRPC-ffmpeg* >/dev/null 2>&1; then
                echo "gRPC-ffmpeg plugin missing from $PLUGIN_DIR. Installing v0.3.2.0..."
                TMP_ZIP="/tmp/grpc-plugin.zip"
                TARGET_DIR="$PLUGIN_DIR/gRPC-ffmpeg_0.3.2.0"
                mkdir -p "$TARGET_DIR"
                if curl -fsSL "https://github.com/CrystalNET-org/Jellyfin.Plugin.GrpcFfmpeg/releases/download/0.3.2/gRPC-ffmpeg_0.3.2.0.zip" -o "$TMP_ZIP"; then
                  if command -v python3 >/dev/null 2>&1; then
                    python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$TMP_ZIP" "$TARGET_DIR"
                  elif command -v unzip >/dev/null 2>&1; then
                    unzip -qo "$TMP_ZIP" -d "$TARGET_DIR"
                  else
                    echo "ERROR: Neither python3 nor unzip available to extract $TMP_ZIP"
                  fi
                  rm -f "$TMP_ZIP"
                  echo "Installed gRPC-ffmpeg plugin to $TARGET_DIR"
                else
                  echo "WARNING: Failed to download gRPC-ffmpeg plugin"
                  rm -rf "$TARGET_DIR"
                fi
              else
                echo "gRPC-ffmpeg plugin already present in $PLUGIN_DIR"
              fi

              # 3. Provision gRPC-ffmpeg configuration if missing (Option 2)
              PLUGIN_CONFIG_DIR="/config/plugins/configurations"
              PLUGIN_CONFIG_FILE="$PLUGIN_CONFIG_DIR/Jellyfin.Plugin.GrpcFfmpeg.xml"
              mkdir -p "$PLUGIN_CONFIG_DIR"
              if [ ! -f "$PLUGIN_CONFIG_FILE" ]; then
                echo "Pre-seeding gRPC-ffmpeg plugin configuration in $PLUGIN_CONFIG_FILE..."
                printf '%s\n' \
                  '<?xml version="1.0" encoding="utf-8"?>' \
                  '<PluginConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">' \
                  '  <Enabled>false</Enabled>' \
                  '  <GrpcHost>jellyfin-ffmpeg-worker</GrpcHost>' \
                  '  <GrpcPort>50051</GrpcPort>' \
                  '  <UseSsl>false</UseSsl>' \
                  "  <AuthToken>${VALID_TOKEN}</AuthToken>" \
                  '  <RunCommandsLocally>true</RunCommandsLocally>' \
                  '  <Retries>2</Retries>' \
                  '  <ConnectTimeout>5</ConnectTimeout>' \
                  '</PluginConfiguration>' > "$PLUGIN_CONFIG_FILE"
                echo "Successfully wrote $PLUGIN_CONFIG_FILE"
              else
                echo "$PLUGIN_CONFIG_FILE already exists, preserving existing configuration."
              fi
          volumeMounts:
            - name: config
              mountPath: /config
        {{- end }}
        {{- if and .Values.theme .Values.theme.abyss .Values.theme.abyss.enabled }}
        - name: init-abyss-theme
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          env:
            - name: ABYSS_REPO
              value: {{ .Values.theme.abyss.repo | quote }}
            - name: ABYSS_BRANCH
              value: {{ .Values.theme.abyss.branch | quote }}
            - name: AUTO_DEFAULTS
              value: {{ .Values.theme.abyss.autoDefaults | default true | quote }}
          command:
            - /bin/sh
            - -cu
            - |
              set -e
              echo "Copying base web assets to volume..."
              cp -R /jellyfin/jellyfin-web/. /web-override/

              WEB_DIR="/web-override"
              UI_DIR="${WEB_DIR}/ui"
              INDEX_FILE="${WEB_DIR}/index.html"
              mkdir -p "$UI_DIR"

              RAW_BASE="https://raw.githubusercontent.com/${ABYSS_REPO:-AumGupta/abyss-jellyfin}/${ABYSS_BRANCH:-main}"

              # 1. Download Spotlight files if missing
              for file in spotlight.html spotlight.css spotlight-loader.js; do
                dest="${UI_DIR}/${file}"
                if [ ! -f "$dest" ]; then
                  echo "Downloading $file to $dest..."
                  curl -fsSL "${RAW_BASE}/scripts/spotlight/${file}" -o "$dest" || echo "Warning: Failed to download $file"
                fi
              done

              # 2. Configure defaults if enabled
              if [ "${AUTO_DEFAULTS:-true}" = "true" ]; then
                DEFAULTS_FILE="${UI_DIR}/abyss-defaults.js"
                if [ ! -f "$DEFAULTS_FILE" ]; then
                  printf '%s\n' \
                    '(function () {' \
                    '  try {' \
                    '    var originalGetItem = Storage.prototype.getItem;' \
                    '    var defaults = {' \
                    "      'enableBackdrops': 'true'," \
                    "      'appTheme': 'dark'," \
                    "      'homesection0': 'resume'," \
                    "      'homesection1': 'nextup'," \
                    "      'homesection2': 'smalllibrarytiles'," \
                    "      'homesection3': 'latestmedia'" \
                    '    };' \
                    '    Storage.prototype.getItem = function (key) {' \
                    '      var val = originalGetItem.apply(this, arguments);' \
                    '      if (val !== null && val !== undefined) return val;' \
                    "      if (this === window.localStorage && typeof key === 'string') {" \
                    '        for (var suffix in defaults) {' \
                    '          if (Object.prototype.hasOwnProperty.call(defaults, suffix)) {' \
                    "            if (key === suffix || key.endsWith('-' + suffix)) return defaults[suffix];" \
                    '          }' \
                    '        }' \
                    '      }' \
                    '      return val;' \
                    '    };' \
                    '  } catch (e) {' \
                    "    console.warn('[abyss-defaults] Failed to apply storage defaults:', e);" \
                    '  }' \
                    '})();' > "$DEFAULTS_FILE"
                  echo "Wrote abyss-defaults.js"
                fi

                if ! grep -q 'ui/abyss-defaults.js' "$INDEX_FILE"; then
                  if grep -q "</head>" "$INDEX_FILE"; then
                    sed -i 's|</head>|<script src="ui/abyss-defaults.js"></script></head>|' "$INDEX_FILE"
                    echo "Injected abyss-defaults.js into <head>"
                  elif grep -q "</body>" "$INDEX_FILE"; then
                    sed -i 's|</body>|<script src="ui/abyss-defaults.js"></script></body>|' "$INDEX_FILE"
                    echo "Injected abyss-defaults.js before </body>"
                  fi
                fi
              fi

              # 3. Inject spotlight loader into index.html
              if ! grep -q 'data-abyss-spotlight' "$INDEX_FILE"; then
                if grep -q "</body>" "$INDEX_FILE"; then
                  sed -i 's|</body>|<script src="ui/spotlight-loader.js" data-abyss-spotlight></script></body>|' "$INDEX_FILE"
                  echo "Injected Spotlight loader into index.html"
                fi
              fi

              # 4. Automatic branding.xml management (Option 2: install only if missing)
              BRANDING_DIR="/config/config"
              BRANDING_FILE="${BRANDING_DIR}/branding.xml"
              mkdir -p "$BRANDING_DIR"

              if [ ! -f "$BRANDING_FILE" ]; then
                echo "branding.xml missing. Creating $BRANDING_FILE with Abyss theme..."
                printf '%s\n' \
                  '<?xml version="1.0" encoding="utf-8"?>' \
                  '<BrandingOptions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">' \
                  '  <LoginDisclaimer>&lt;form action="/sso/OID/start/pocketid" method="get" style="display: block; width: 100%; margin: 0; padding: 0;"&gt;' \
                  '  &lt;button type="submit" ' \
                  '          style="display: block; width: 100%; box-sizing: border-box; background-color: #00a4dc; color: #000000; font-family: inherit; font-size: inherit; font-weight: 600; line-height: 1.35; border: 0; border-radius: 0.2em; padding: 0.9em 1em; margin: 0.25em 0; text-align: center; cursor: pointer;"&gt;' \
                  '    &lt;span style="color: #000000; font-weight: 600;"&gt;Sign in with Pocket ID&lt;/span&gt;' \
                  '  &lt;/button&gt;' \
                  '&lt;/form&gt;</LoginDisclaimer>' \
                  "  <CustomCss>@import url('https://cdn.jsdelivr.net/gh/AumGupta/abyss-jellyfin@main/abyss.css');" \
                  '' \
                  '.loginDisclaimerContainer {' \
                  '  display: block !important;' \
                  '  width: 100% !important;' \
                  '  margin-top: 1.5em !important;' \
                  '}' \
                  '' \
                  '.loginDisclaimer {' \
                  '  display: block !important;' \
                  '  width: 100% !important;' \
                  '  max-width: 100% !important;' \
                  '  margin: 0 !important;' \
                  '}' \
                  '' \
                  '.loginDisclaimer button:hover {' \
                  '  background-color: #00729a !important;' \
                  '}</CustomCss>' \
                  '  <SplashscreenEnabled>true</SplashscreenEnabled>' \
                  '  <SplashscreenLocation>/config/data/splashscreen-upload.jpg</SplashscreenLocation>' \
                  '</BrandingOptions>' > "$BRANDING_FILE"
                echo "Successfully wrote $BRANDING_FILE"
              elif ! grep -q "abyss-jellyfin" "$BRANDING_FILE"; then
                echo "Abyss theme @import missing from $BRANDING_FILE. Adding to CustomCss..."
                if grep -q "<CustomCss>" "$BRANDING_FILE"; then
                  sed -i "s|<CustomCss>|<CustomCss>@import url('https://cdn.jsdelivr.net/gh/AumGupta/abyss-jellyfin@main/abyss.css');\n\n|" "$BRANDING_FILE"
                fi
                echo "Updated $BRANDING_FILE with Abyss theme import"
              else
                echo "$BRANDING_FILE already configured with Abyss theme, preserving existing configuration."
              fi
          volumeMounts:
            - name: jellyfin-web
              mountPath: /web-override
            - name: config
              mountPath: /config
        {{- end }}

      containers:
        - name: jellyfin
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: TZ
              value: {{ .Values.TZ }}
            - name: JELLYFIN_DATA_DIR
              value: /config
            - name: JELLYFIN_CACHE_DIR
              value: /cache
            - name: TMPDIR
              value: /cache/temp
            - name: JELLYFIN_FFMPEG
              value: /usr/local/bin/ffmpeg
          livenessProbe:
            httpGet:
              port: 8096
              path: /health
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              port: 8096
              path: /health
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            {{- if and .Values.theme .Values.theme.abyss .Values.theme.abyss.enabled }}
            - name: jellyfin-web
              mountPath: /jellyfin/jellyfin-web
            {{- end }}
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /mnt/pool/media
            - name: rffmpeg-config
              mountPath: /etc/rffmpeg/rffmpeg.yml
              subPath: rffmpeg.yml
            - name: shm
              mountPath: /run/shm
        - name: rffmpeg-sync
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          command:
            - rffmpeg-init
            - --interval
            - "60"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: rffmpeg-config
              mountPath: /etc/rffmpeg/rffmpeg.yml
              subPath: rffmpeg.yml
            - name: ssh-key
              mountPath: /etc/rffmpeg-ssh
              readOnly: true
      volumes:
        {{- if and .Values.theme .Values.theme.abyss .Values.theme.abyss.enabled }}
        - name: jellyfin-web
          emptyDir: {}
        {{- end }}
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-v2
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache-v2
        - name: media
          nfs:
            server: {{ .Values.network.storageServer }}
            path: /mnt/pool/media
        - name: rffmpeg-config
          configMap:
            name: jellyfin-rffmpeg-config
        - name: ssh-key
          secret:
            secretName: jellyfin-rffmpeg-ssh
            defaultMode: 0400
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi

