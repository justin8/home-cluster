apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-init.yaml") . | sha256sum }}
    spec:
      serviceAccountName: jellyfin
      securityContext:
        fsGroup: {{ .Values.PGID }}
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-web
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          command:
            - sh
            - -c
            - cp -R /jellyfin/jellyfin-web/* /web-override/
          volumeMounts:
            - name: jellyfin-web
              mountPath: /web-override
        - name: init-config
          image: "{{ .Values.images.init.repository }}:{{ .Values.images.init.tag }}"
          imagePullPolicy: {{ .Values.images.init.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          env:
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: issuer_url
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: client_id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: client_secret
            - name: GRPC_ENABLED
              value: {{ and .Values.grpcWorker .Values.grpcWorker.enabled | default false | quote }}
            {{- if and .Values.grpcWorker .Values.grpcWorker.enabled }}
            - name: VALID_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jellyfin-grpc-worker
                  key: VALID_TOKEN
            {{- end }}
          command:
            - python3
            - /scripts/init.py
          volumeMounts:
            - name: config
              mountPath: /config
            - name: init-script
              mountPath: /scripts
            - name: jellyfin-web
              mountPath: /web-override

      containers:
        - name: jellyfin
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: TZ
              value: {{ .Values.TZ }}
            - name: JELLYFIN_DATA_DIR
              value: /config
            - name: JELLYFIN_CACHE_DIR
              value: /cache
            - name: TMPDIR
              value: /cache/temp
          livenessProbe:
            httpGet:
              port: 8096
              path: /health
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              port: 8096
              path: /health
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: jellyfin-web
              mountPath: /jellyfin/jellyfin-web
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /mnt/pool/media
      volumes:
        - name: init-script
          configMap:
            name: jellyfin-init-script
            defaultMode: 0755
        - name: jellyfin-web
          emptyDir: {}
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-v2
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache-v2
        - name: media
          nfs:
            server: {{ .Values.network.storageServer }}
            path: /mnt/pool/media

