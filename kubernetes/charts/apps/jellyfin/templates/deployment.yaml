apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ if hasKey .Values "replicas" }}{{ .Values.replicas }}{{ else }}1{{ end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      serviceAccountName: jellyfin
      securityContext:
        fsGroup: {{ .Values.PGID }}
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    longhorn.io/component: share-manager
                namespaces:
                  - longhorn-system
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: provision-sso-config
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          env:
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: issuer_url
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: client_id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: client_secret
          command:
            - /bin/sh
            - -cu
            - |
              CONFIG_DIR="/config/plugins/configurations"
              CONFIG_FILE="$CONFIG_DIR/SSO-Auth.xml"
              mkdir -p "$CONFIG_DIR"
              if [ ! -f "$CONFIG_FILE" ] || ! grep -q "DisablePushedAuthorization" "$CONFIG_FILE"; then
                echo "Injecting Pocket ID configuration with AdminRoles, SchemeOverride, and DisablePushedAuthorization into $CONFIG_FILE..."
                printf '%s\n' \
                  '<?xml version="1.0" encoding="utf-8"?>' \
                  '<PluginConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">' \
                  '  <SamlConfigs />' \
                  '  <OidConfigs>' \
                  '    <item>' \
                  '      <key>' \
                  '        <string>pocketid</string>' \
                  '      </key>' \
                  '      <value>' \
                  '        <PluginConfiguration>' \
                  "          <OidEndpoint>${OIDC_ISSUER}/.well-known/openid-configuration</OidEndpoint>" \
                  "          <OidClientId>${OIDC_CLIENT_ID}</OidClientId>" \
                  "          <OidSecret>${OIDC_CLIENT_SECRET}</OidSecret>" \
                  '          <Enabled>true</Enabled>' \
                  '          <EnableAuthorization>true</EnableAuthorization>' \
                  '          <EnableAllFolders>true</EnableAllFolders>' \
                  '          <SchemeOverride>https</SchemeOverride>' \
                  '          <DisablePushedAuthorization>true</DisablePushedAuthorization>' \
                  '          <RoleClaim>groups</RoleClaim>' \
                  '          <AdminRoles>' \
                  '            <string>admin</string>' \
                  '            <string>Admin</string>' \
                  '          </AdminRoles>' \
                  '          <PreserveAdminPermissions>true</PreserveAdminPermissions>' \
                  '          <OidScopes>' \
                  '            <string>openid</string>' \
                  '            <string>profile</string>' \
                  '            <string>email</string>' \
                  '            <string>groups</string>' \
                  '          </OidScopes>' \
                  '        </PluginConfiguration>' \
                  '      </value>' \
                  '    </item>' \
                  '  </OidConfigs>' \
                  '</PluginConfiguration>' > "$CONFIG_FILE"
                echo "Successfully wrote $CONFIG_FILE"
              else
                echo "$CONFIG_FILE already contains updated configuration, preserving existing configuration."
              fi
        - name: init-rffmpeg
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          command:
            - rffmpeg-init
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: rffmpeg-config
              mountPath: /etc/rffmpeg/rffmpeg.yml
              subPath: rffmpeg.yml
            - name: ssh-key
              mountPath: /etc/rffmpeg-ssh
              readOnly: true
        {{- if and .Values.theme .Values.theme.abyss .Values.theme.abyss.enabled }}
        - name: init-abyss-theme
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          env:
            - name: ABYSS_REPO
              value: {{ .Values.theme.abyss.repo | quote }}
            - name: ABYSS_BRANCH
              value: {{ .Values.theme.abyss.branch | quote }}
            - name: AUTO_DEFAULTS
              value: {{ .Values.theme.abyss.autoDefaults | default true | quote }}
          command:
            - /bin/sh
            - -cu
            - |
              set -e
              echo "Copying base web assets to volume..."
              cp -R /usr/share/jellyfin/web/. /web-override/
              python3 - << 'EOF'
              import os, urllib.request

              repo = os.environ.get("ABYSS_REPO", "AumGupta/abyss-jellyfin")
              branch = os.environ.get("ABYSS_BRANCH", "main")
              auto_defaults = os.environ.get("AUTO_DEFAULTS", "true").lower() == "true"
              raw_base = f"https://raw.githubusercontent.com/{repo}/{branch}"
              web_dir = "/web-override"
              ui_dir = os.path.join(web_dir, "ui")
              os.makedirs(ui_dir, exist_ok=True)

              spotlight_files = [
                  "scripts/spotlight/spotlight.html",
                  "scripts/spotlight/spotlight.css",
                  "scripts/spotlight/spotlight-loader.js",
              ]

              try:
                  for rel_path in spotlight_files:
                      fname = os.path.basename(rel_path)
                      url = f"{raw_base}/{rel_path}"
                      dest = os.path.join(ui_dir, fname)
                      print(f"Downloading {url} to {dest}...")
                      urllib.request.urlretrieve(url, dest)

                  index_file = os.path.join(web_dir, "index.html")
                  with open(index_file, "r", encoding="utf-8") as f:
                      html = f.read()

                  if auto_defaults:
                      defaults_js = (
                          "(function () {\n"
                          "  try {\n"
                          "    var originalGetItem = Storage.prototype.getItem;\n"
                          "    var defaults = {\n"
                          "      'enableBackdrops': 'true',\n"
                          "      'appTheme': 'dark',\n"
                          "      'homesection0': 'resume',\n"
                          "      'homesection1': 'nextup',\n"
                          "      'homesection2': 'smalllibrarytiles',\n"
                          "      'homesection3': 'latestmedia'\n"
                          "    };\n"
                          "    Storage.prototype.getItem = function (key) {\n"
                          "      var val = originalGetItem.apply(this, arguments);\n"
                          "      if (val !== null && val !== undefined) return val;\n"
                          "      if (this === window.localStorage && typeof key === 'string') {\n"
                          "        for (var suffix in defaults) {\n"
                          "          if (Object.prototype.hasOwnProperty.call(defaults, suffix)) {\n"
                          "            if (key === suffix || key.endsWith('-' + suffix)) return defaults[suffix];\n"
                          "          }\n"
                          "        }\n"
                          "      }\n"
                          "      return val;\n"
                          "    };\n"
                          "  } catch (e) {\n"
                          "    console.warn('[abyss-defaults] Failed to apply storage defaults:', e);\n"
                          "  }\n"
                          "})();\n"
                      )
                      defaults_path = os.path.join(ui_dir, "abyss-defaults.js")
                      with open(defaults_path, "w", encoding="utf-8") as f:
                          f.write(defaults_js)
                      print("Wrote abyss-defaults.js")

                      defaults_tag = '<script src="ui/abyss-defaults.js"></script>'
                      if defaults_tag not in html:
                          if "</head>" in html:
                              html = html.replace("</head>", f"{defaults_tag}</head>")
                              print("Injected abyss-defaults.js into <head>")
                          elif "</body>" in html:
                              html = html.replace("</body>", f"{defaults_tag}</body>")
                              print("Injected abyss-defaults.js before </body>")

                  loader_tag = '<script src="ui/spotlight-loader.js" data-abyss-spotlight></script>'
                  if loader_tag not in html:
                      if "</body>" in html:
                          html = html.replace("</body>", f"{loader_tag}</body>")
                          print("Successfully injected Spotlight loader into index.html")
                      else:
                          print("Warning: </body> not found in index.html")
                  else:
                      print("Spotlight loader already present in index.html")

                  with open(index_file, "w", encoding="utf-8") as f:
                      f.write(html)
              except Exception as e:
                  print(f"Warning: Failed to setup Abyss files: {e}")
              EOF
          volumeMounts:
            - name: jellyfin-web
              mountPath: /web-override
        {{- end }}
      containers:
        - name: jellyfin
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          ports:
            - containerPort: 8096
              name: http
          env:
            - name: TZ
              value: {{ .Values.TZ }}
            - name: JELLYFIN_DATA_DIR
              value: /config
            - name: JELLYFIN_CACHE_DIR
              value: /cache
            - name: TMPDIR
              value: /cache/temp
            - name: JELLYFIN_FFMPEG
              value: /usr/local/bin/ffmpeg
          livenessProbe:
            httpGet:
              port: 8096
              path: /health
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              port: 8096
              path: /health
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            {{- if and .Values.theme .Values.theme.abyss .Values.theme.abyss.enabled }}
            - name: jellyfin-web
              mountPath: /usr/share/jellyfin/web
            {{- end }}
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /mnt/pool/media
            - name: rffmpeg-config
              mountPath: /etc/rffmpeg/rffmpeg.yml
              subPath: rffmpeg.yml
            - name: shm
              mountPath: /run/shm
        - name: rffmpeg-sync
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.app.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
          command:
            - rffmpeg-init
            - --interval
            - "60"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: rffmpeg-config
              mountPath: /etc/rffmpeg/rffmpeg.yml
              subPath: rffmpeg.yml
            - name: ssh-key
              mountPath: /etc/rffmpeg-ssh
              readOnly: true
      volumes:
        {{- if and .Values.theme .Values.theme.abyss .Values.theme.abyss.enabled }}
        - name: jellyfin-web
          emptyDir: {}
        {{- end }}
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: media
          nfs:
            server: {{ .Values.network.storageServer }}
            path: /mnt/pool/media
        - name: rffmpeg-config
          configMap:
            name: jellyfin-rffmpeg-config
        - name: ssh-key
          secret:
            secretName: jellyfin-rffmpeg-ssh
            defaultMode: 0400
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi

