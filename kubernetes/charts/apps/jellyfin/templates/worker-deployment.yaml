apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-rffmpeg-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: jellyfin-rffmpeg-worker
spec:
  replicas: {{ .Values.worker.replicas | default 3 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: jellyfin-rffmpeg-worker
  template:
    metadata:
      labels:
        app: jellyfin-rffmpeg-worker
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: ["jellyfin-rffmpeg-worker"]
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      securityContext:
        fsGroup: {{ .Values.PGID }}
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.PUID }}
            runAsGroup: {{ .Values.PGID }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: ssh
              containerPort: 2222
          resources:
            requests:
              gpu.intel.com/i915: "1"
            limits:
              gpu.intel.com/i915: "1"
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /mnt/pool/media
            - name: ssh-key
              mountPath: /etc/rffmpeg-worker/keys
              readOnly: true
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: media
          nfs:
            server: {{ .Values.network.storageServer }}
            path: /mnt/pool/media
        - name: ssh-key
          secret:
            secretName: jellyfin-rffmpeg-ssh
            items:
              - key: authorized_keys
                path: authorized_keys
