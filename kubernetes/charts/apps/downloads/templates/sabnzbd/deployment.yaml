apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      securityContext:
        runAsUser: {{ .Values.PUID }}
        runAsGroup: {{ .Values.PGID }}
        fsGroup: {{ .Values.PGID }}
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-permissions
          image: "{{ .Values.images.busybox.repository }}:{{ .Values.images.busybox.tag }}"
          imagePullPolicy: {{ .Values.images.busybox.pullPolicy }}
          command:
            - sh
            - -c
            - chown -R {{ .Values.PUID }}:{{ .Values.PGID }} /config
          volumeMounts:
            - name: config
              mountPath: /config
          securityContext:
            runAsUser: 0
      containers:
        - name: sabnzbd
          image: "{{ .Values.images.sabnzbd.repository }}:{{ .Values.images.sabnzbd.tag }}"
          imagePullPolicy: {{ .Values.images.sabnzbd.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: downloads-config
          securityContext:
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /mnt/pool/media/downloads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config-v2
        - name: downloads
          nfs:
            server: {{ .Values.network.storageServer }}
            path: /mnt/pool/media/downloads
        - name: tmp
          emptyDir: {}
