apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      containers:
        - name: sabnzbd
          image: "{{ .Values.images.sabnzbd.repository }}:{{ .Values.images.sabnzbd.tag }}"
          imagePullPolicy: {{ .Values.images.sabnzbd.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: downloads-config
          env:
            - name: S6_READ_ONLY_ROOT
              value: "1"
          securityContext:
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /mnt/pool/media/downloads
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
            - name: log
              mountPath: /var/log
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config-v2
        - name: downloads
          nfs:
            server: {{ .Values.network.storageServer }}
            path: /mnt/pool/media/downloads
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: log
          emptyDir: {}
