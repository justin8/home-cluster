apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      securityContext:
        runAsUser: {{ .Values.PUID }}
        runAsGroup: {{ .Values.PGID }}
        fsGroup: {{ .Values.PGID }}
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-permissions
          image: "{{ .Values.images.busybox.repository }}:{{ .Values.images.busybox.tag }}"
          imagePullPolicy: {{ .Values.images.busybox.pullPolicy }}
          command:
            - sh
            - -c
            - chown -R {{ .Values.PUID }}:{{ .Values.PGID }} /config
          volumeMounts:
            - name: config
              mountPath: /config
          securityContext:
            runAsUser: 0
      containers:
        - name: prowlarr
          image: "{{ .Values.images.prowlarr.repository }}:{{ .Values.images.prowlarr.tag }}"
          imagePullPolicy: {{ .Values.images.prowlarr.pullPolicy }}
          ports:
            - containerPort: 9696
          envFrom:
            - configMapRef:
                name: downloads-config
          securityContext:
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /
              port: 9696
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config-v2
        - name: tmp
          emptyDir: {}

