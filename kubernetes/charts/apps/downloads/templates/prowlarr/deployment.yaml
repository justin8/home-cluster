apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      containers:
        - name: prowlarr
          image: "{{ .Values.images.prowlarr.repository }}:{{ .Values.images.prowlarr.tag }}"
          imagePullPolicy: {{ .Values.images.prowlarr.pullPolicy }}
          ports:
            - containerPort: 9696
          envFrom:
            - configMapRef:
                name: downloads-config
          env:
            - name: S6_READ_ONLY_ROOT
              value: "1"
          securityContext:
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /
              port: 9696
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
            - name: log
              mountPath: /var/log
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config-v2
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: log
          emptyDir: {}

