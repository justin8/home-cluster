apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanuparr
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cleanuparr
  template:
    metadata:
      labels:
        app: cleanuparr
    spec:
      containers:
        - name: cleanuparr
          image: "{{ .Values.images.cleanuparr.repository }}:{{ .Values.images.cleanuparr.tag }}"
          imagePullPolicy: {{ .Values.images.cleanuparr.pullPolicy }}
          ports:
            - containerPort: 11011
          envFrom:
            - configMapRef:
                name: downloads-config
          env:
            - name: PORT
              value: "11011"
          livenessProbe:
            httpGet:
              path: /
              port: 11011
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: cleanuparr-config
