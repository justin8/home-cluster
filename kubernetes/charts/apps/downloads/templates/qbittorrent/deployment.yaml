apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      securityContext:
        sysctls:
          - name: net.ipv4.conf.all.src_valid_mark
            value: "1"
      containers:
        - name: vpn
          image: "{{ .Values.images.wireguard.repository }}:{{ .Values.images.wireguard.tag }}"
          imagePullPolicy: {{ .Values.images.wireguard.pullPolicy }}
          securityContext:
            privileged: true
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    (
                      until ip link show wg0 >/dev/null 2>&1; do sleep 1; done
                      sleep 2
                      GW=$(ip route show default | awk '{print $3}')
                      for cidr in 10.244.0.0/16 10.96.0.0/12 192.168.5.0/24 100.64.0.0/10; do
                        ip route add $cidr via $GW dev eth0 2>/dev/null || true
                        iptables -I OUTPUT 1 -d $cidr -j ACCEPT 2>/dev/null || true
                      done
                    ) &
          volumeMounts:
            - name: vpn-config
              mountPath: /etc/wireguard
        - name: qbittorrent
          image: "{{ .Values.images.qbittorrent.repository }}:{{ .Values.images.qbittorrent.tag }}"
          imagePullPolicy: {{ .Values.images.qbittorrent.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: qbittorrent-config
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /mnt/pool/media/downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-data
        - name: downloads
          nfs:
            server: {{ .Values.network.storageServer }}
            path: /mnt/pool/media/downloads
        - name: vpn-config
          secret:
            secretName: qbittorrent-vpn
