apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      securityContext:
        sysctls:
          - name: net.ipv4.conf.all.src_valid_mark
            value: "1"
      containers:
        - name: gluetun
          image: "{{ .Values.images.gluetun.repository }}:{{ .Values.images.gluetun.tag }}"
          imagePullPolicy: {{ .Values.images.gluetun.pullPolicy }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: custom
            - name: VPN_TYPE
              value: wireguard
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "{{ .Values.network.clusterPodNet }},10.96.0.0/12,{{ .Values.network.lanIpRange }},{{ .Values.network.tailscaleIpRange }}"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: FIREWALL_VPN_INPUT_PORTS
              value: "9514"
          livenessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vpn-config
              mountPath: /gluetun/wireguard/wg0.conf
              subPath: wg0.conf
            - name: dev-tun
              mountPath: /dev/net/tun
        - name: qbittorrent
          image: "{{ .Values.images.qbittorrent.repository }}:{{ .Values.images.qbittorrent.tag }}"
          imagePullPolicy: {{ .Values.images.qbittorrent.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: qbittorrent-config
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /mnt/pool/media/downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-data
        - name: downloads
          nfs:
            server: {{ .Values.network.storageServer }}
            path: /mnt/pool/media/downloads
        - name: vpn-config
          secret:
            secretName: qbittorrent-vpn
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
