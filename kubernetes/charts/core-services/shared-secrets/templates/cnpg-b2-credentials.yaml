apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cnpg-b2-credentials
  namespace: kube-system
spec:
  template:
    metadata:
      name: cnpg-b2-credentials
      namespace: kube-system
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "home-automation,immich"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "home-automation,immich"
    type: Opaque
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_SECRET_ACCESS_KEY: 
