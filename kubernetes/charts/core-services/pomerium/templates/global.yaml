apiVersion: ingress.pomerium.io/v1
kind: Pomerium
metadata:
  name: global
  namespace: {{ .Release.Namespace }}
spec:
  secrets: {{ .Release.Namespace }}/bootstrap
  authenticate:
    url: https://authenticate.{{ .Values.domain }}
  certificates:
    - {{ .Release.Namespace }}/default-tls
  cookie:
    domain: {{ .Values.domain }}
  identityProvider:
    provider: oidc
    secret: {{ .Release.Namespace }}/pomerium-oidc-credentials
    url: https://pocketid.{{ .Values.domain }}
  jwtClaimHeaders:
    X-Pomerium-Claim-Email: email
    X-Pomerium-Claim-User: user
    X-Pomerium-Claim-Name: name
    X-Pomerium-Claim-Preferred-Username: preferred_username
  storage:
    file:
      path: /var/pomerium/databroker
