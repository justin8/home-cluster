apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pomerium
  namespace: {{ .Release.Namespace }}
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pomerium
  ingress:
    # Client web traffic (HTTPS, HTTP redirect, QUIC)
    - fromEntities:
        - host
        - world
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "443"
              protocol: UDP
            - port: "8443"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # Pomerium databroker / control plane (inter-replica only)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            app.kubernetes.io/name: pomerium
      toPorts:
        - ports:
            - port: "5443"
              protocol: TCP
  egress:
    # Egress to all internal cluster backend services
    - toEntities:
        - cluster
    # Inter-replica communication
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            app.kubernetes.io/name: pomerium
      toPorts:
        - ports:
            - port: "5443"
              protocol: TCP
    # PocketID in auth namespace
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: pocket-id
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
    - toEntities:
        - world
