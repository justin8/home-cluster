apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pomerium
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pomerium
  ingress:
    - fromEntities:
        - host
        - world
        - cluster
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "443"
              protocol: UDP
            - port: "8080"
              protocol: TCP
            - port: "8443"
              protocol: TCP
            - port: "5443"
              protocol: TCP
            - port: "9090"
              protocol: TCP
  egress:
    # Egress to all internal cluster backend services
    - toEntities:
        - cluster
    # Inter-replica communication
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            app.kubernetes.io/name: pomerium
      toPorts:
        - ports:
            - port: "5443"
              protocol: TCP
    # PocketID in auth namespace
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: pocket-id
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
    - toEntities:
        - world
