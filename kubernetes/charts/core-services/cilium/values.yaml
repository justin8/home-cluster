cilium:
  ipam:
    mode: kubernetes
  kubeProxyReplacement: true
  k8sServiceHost: localhost
  k8sServicePort: 7445
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
  l2announcements:
    enabled: true
  k8sClientRateLimit:
    qps: 30
    burst: 50
  rollOutPods: true
  operator:
    replicas: 1
    rollOutPods: true
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true

# Toggled to true after the live cluster is shut down
ipPools:
  enabled: false
