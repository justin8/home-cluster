{{- if .Values.ipPools.enabled }}
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
spec:
  blocks:
    - start: "192.168.5.80"
      stop: "192.168.5.100"
  allowFirstLastIPs: "Yes"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: pomerium-ingress
spec:
  blocks:
    - cidr: "{{ .Values.network.pomeriumIngress }}/32"
  allowFirstLastIPs: "Yes"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: dns-server
spec:
  blocks:
    - cidr: "{{ .Values.network.dnsServer }}/32"
  allowFirstLastIPs: "Yes"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: public-ingress
spec:
  blocks:
    - cidr: "{{ .Values.network.publicIngress }}/32"
  allowFirstLastIPs: "Yes"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-l2-policy
spec:
  interfaces:
    - ^eth[0-9]+
    - ^en[a-z0-9]+
  loadBalancerIPs: true
{{- end }}
