# Internal web service for external-dns to reach primary pihole API and for Pomerium ingress
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: pihole
spec:
  selector:
    app: pihole
    pihole/type: primary
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# Internal web service for external-dns to reach secondary pihole API
apiVersion: v1
kind: Service
metadata:
  name: pihole-secondary-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: pihole
spec:
  selector:
    app: pihole
    pihole/type: secondary
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# LoadBalancer service for DNS traffic (shared across all pihole instances)
apiVersion: v1
kind: Service
metadata:
  name: dns
  namespace: {{ .Release.Namespace }}
  labels:
    app: pihole
  annotations:
    cilium.io/load-balancer-ip-pools: dns-server
    io.cilium/lb-ipam-ips: {{ .Values.network.dnsServer }}
spec:
  type: LoadBalancer
  selector:
    app: pihole
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
---
# LoadBalancer service for DNS traffic (but on Tailscale, shared across all pihole instances)
apiVersion: v1
kind: Service
metadata:
  name: dns-tailscale
  namespace: {{ .Release.Namespace }}
  labels:
    app: pihole
  annotations:
    tailscale.com/hostname: pihole
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: pihole
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
