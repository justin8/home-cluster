apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocketid
  namespace: {{ .Release.Namespace }}
spec:
  image: "{{ .Values.images.pocketid.repository }}:{{ .Values.images.pocketid.tag }}"
  appUrl: "https://pocketid.{{ .Values.domain }}"
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocketid-secrets
        key: ENCRYPTION_KEY
  geoip:
    maxmindLicenseKey:
      valueFrom:
        secretKeyRef:
          name: pocketid-secrets
          key: MAXMIND_LICENSE_KEY
  persistence:
    enabled: true
    size: {{ .Values.pocketidVolumeSizeGi }}Gi
    existingClaim: pocketid-real-data
  smtp:
    from: "justin@dray.be"
    host: "email-smtp.us-west-2.amazonaws.com"
    port: 587
    user: AKIASWRXGFVDIZYPWCSL
    password:
      valueFrom:
        secretKeyRef:
          name: pocketid-secrets
          key: SMTP_PASSWORD
    tls: starttls
  ui:
    appName: "dray.id.au"
    sessionDuration: 10080
  userManagement:
    allowUserSignups: "disabled"
    emailsVerified: true
  emailNotifications:
    oneTimeAccessAsAdmin: true
    apiKeyExpiration: true
