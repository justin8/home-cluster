apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocketid
  namespace: {{ .Release.Namespace }}
spec:
  image: "{{ .Values.images.pocketid.repository }}:{{ .Values.images.pocketid.tag }}"
  appUrl: "https://pocketid.{{ .Values.domain }}"
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocketid-secrets
        key: ENCRYPTION_KEY
  geoip:
    maxmindLicenseKey:
      valueFrom:
        secretKeyRef:
          name: pocketid-secrets
          key: MAXMIND_LICENSE_KEY
  persistence:
    enabled: true
    size: {{ .Values.pocketidVolumeSizeGi }}Gi
    existingClaim: pocketid-data-v2
  smtp:
    from: "pocketid@{{ .Values.domain }}"
    host: "smtp.mail-proxy.svc.cluster.local"
    port: 587
    tls: none
  ui:
    appName: "dray.id.au"
    sessionDuration: 10080
  userManagement:
    allowUserSignups: "disabled"
    emailsVerified: true
  emailNotifications:
    oneTimeAccessAsAdmin: true
    apiKeyExpiration: true
