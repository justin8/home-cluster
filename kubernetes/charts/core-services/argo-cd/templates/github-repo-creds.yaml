apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-repo-creds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  encryptedData:
    password: ""
  template:
    metadata:
      name: github-repo-creds
      namespace: argocd
      labels:
        argocd.argoproj.io/secret-type: repository
    type: Opaque
    stringData:
      type: git
      url: https://github.com/justin8/home-cluster.git
      username: git
