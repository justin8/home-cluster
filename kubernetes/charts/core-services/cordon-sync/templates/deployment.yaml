apiVersion: apps/v1
kind: Deployment
metadata:
  name: cordon-sync
  namespace: {{ .Release.Namespace }}
  labels:
    app: cordon-sync
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: cordon-sync
  template:
    metadata:
      labels:
        app: cordon-sync
    spec:
      serviceAccountName: cordon-sync
      containers:
        - name: cordon-sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - /scripts/sync.sh
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: cordon-sync-script
            defaultMode: 0755
        - name: tmp
          emptyDir: {}

