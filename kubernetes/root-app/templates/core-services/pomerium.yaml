apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pomerium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/pomerium/ingress-controller.git
      targetRevision: v0.32.0
      path: config/default
      kustomize:
        commonLabels:
          app.kubernetes.io/instance: pomerium
        patches:
          - target:
              kind: Service
              name: pomerium-proxy
            patch: |-
              - op: add
                path: /metadata/annotations
                value:
                  cilium.io/load-balancer-ip-pools: pomerium-ingress
                  io.cilium/lb-ipam-ips: {{ .Values.network.pomeriumIngress }}
              - op: add
                path: /spec/externalTrafficPolicy
                value: Local
          - target:
              kind: Deployment
              name: pomerium
            patch: |-
              - op: replace
                path: /spec/replicas
                value: 1
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
              - op: remove
                path: /spec/template/spec/containers/0/resources
              - op: add
                path: /spec/template/spec/securityContext/fsGroup
                value: 65532
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: databroker-storage
                  persistentVolumeClaim:
                    claimName: pomerium-storage-v2
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: databroker-storage
                  mountPath: /var/pomerium/databroker
              - op: add
                path: /spec/template/spec/affinity
                value:
                  podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        podAffinityTerm:
                          labelSelector:
                            matchLabels:
                              app.kubernetes.io/instance: pomerium
                              app.kubernetes.io/name: pomerium
                          topologyKey: kubernetes.io/hostname
    - repoURL: https://github.com/justin8/home-cluster.git
      targetRevision: main
      path: kubernetes/charts/core-services/pomerium
      helm:
        valueFiles:
          - ../../../global-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pomerium
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: bootstrap
      jsonPointers:
        - /data
